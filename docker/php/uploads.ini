; Configuración personalizada para subida de archivos (Requisito: Máximo 10MB)
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 1
memory_limit = 128M
max_execution_time = 60
display_errors = Off
log_errors = On
expose_php = Off
session.cookie_httponly = 1
session.cookie_samesite = Strict
