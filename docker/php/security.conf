ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Attachments are served by their download endpoint; legacy images stay readable.
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|py|sh)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html/config>
    Require all denied
</Directory>

<Directory /var/www/html/components>
    Require all denied
</Directory>

<Directory /var/www/html/views>
    Require all denied
</Directory>

<Directory /var/www/html/modals>
    Require all denied
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
<FilesMatch "\.php$">
    Header always set Cache-Control "no-store, private"
</FilesMatch>
