ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# src se monta desde un sistema de archivos que puede no distinguir mayúsculas
# (Windows/macOS): /Uploads o /CONFIG llegarían al mismo directorio. Por eso las
# denegaciones usan DirectoryMatch con (?i) en lugar de <Directory> con la ruta exacta.
<DirectoryMatch "(?i)^/var/www/html/(config|components|views|modals)(/|$)">
    Require all denied
</DirectoryMatch>

# Los adjuntos clínicos solo se sirven por api/download_archivo.php (con sesión y permiso).
# Desde /uploads solo quedan públicos los logos institucionales usados en los impresos.
<DirectoryMatch "(?i)^/var/www/html/uploads(/|$)">
    Options -Indexes -ExecCGI
    Require all denied
    <FilesMatch "(?i)^logo_[A-Za-z0-9_-]+\.(png|jpe?g)$">
        Require all granted
    </FilesMatch>
</DirectoryMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# CSP de la aplicación. La interfaz usa manejadores onclick en línea, por eso
# script-src mantiene 'unsafe-inline'. setifempty respeta la CSP propia que
# envían algunos scripts (descargas de adjuntos, documentos imprimibles).
Header setifempty Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

<FilesMatch "\.php$">
    Header always set Cache-Control "no-store, private"
</FilesMatch>
