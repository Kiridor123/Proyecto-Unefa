services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      # Solo lectura: los adjuntos nuevos se guardan en el volumen medical_storage.
      - ./src:/var/www/html:ro
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - medical_storage:/var/www/storage
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-unefa_medica}
      DB_USER: ${DB_USER:-unefa_admin}
      DB_PASSWORD: ${DB_PASSWORD:-unefa_secure_pass}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Caracas}
      UPLOAD_DIR: /var/www/storage/attachments
      # Administrador inicial: solo se crea si la tabla de usuarios está vacía.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 1 solo si un proxy inverso de confianza termina HTTPS delante de este contenedor.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/api/health.php') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-unefa_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unefa_secure_pass}
      POSTGRES_DB: ${DB_NAME:-unefa_medica}
      TZ: ${APP_TIMEZONE:-America/Caracas}
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  medical_storage:
