# Isolated integration environment. It never mounts the application's data volumes.
services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./tests:/var/www/tests:ro
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - test_attachments:/var/www/storage
    environment:
      DB_HOST: db
      DB_NAME: unefa_medica_test
      DB_USER: unefa_test
      DB_PASSWORD: integration_only
      APP_TIMEZONE: America/Caracas
      UPLOAD_DIR: /var/www/storage/attachments
      ADMIN_USER: admin
      ADMIN_PASSWORD: integration_admin_only
      TRUST_PROXY: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/api/health.php') === false ? 1 : 0);"]
      interval: 3s
      timeout: 5s
      retries: 20
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: unefa_medica_test
      POSTGRES_USER: unefa_test
      POSTGRES_PASSWORD: integration_only
      TZ: America/Caracas
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - test_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unefa_test -d unefa_medica_test"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  test_database:
  test_attachments:
